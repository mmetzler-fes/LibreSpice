services:
  librespice:
    build: .
    image: librespice
    # Run as your host user so files written into ./library are owned by you
    # (no root/sudo needed to edit or delete them). Override via the .env file
    # if your UID/GID differ from 1000:1000.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      # Component library on the host: drop .lib/.asy/.json files into
      # ./library/{sub,sym,cmp} and they are picked up automatically.
      - ./library:/data/lib
      # Die Dateien, die Schaltungen einlesen (`wavefile=`, `PWL file=`). Sie
      # liegen auf dem Host, nicht im Image: ein geteilter Link holt sich so
      # seine Audiodatei selbst, ohne dass fremde Aufnahmen ins Repository oder
      # ins Image wandern (siehe samples/README.md).
      - ./samples:/data/samples:ro
    environment:
      LIBRESPICE_LIB_DIR: /data/lib
      LIBRESPICE_SAMPLE_DIR: /data/samples
    restart: unless-stopped
