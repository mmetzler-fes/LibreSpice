name: Build Docker image

# Build the container on every push to main / version tag, and build (without
# publishing) on pull requests so a broken Dockerfile is caught before merge.
#
# Two image variants are published because the app's public base path is baked
# in at build time (Vite BASE_PATH):
#   * <tags>       — served at the root "/"          (run with APP_BASE=/)
#   * <tags>-app   — served under "/app/" with the   (run with APP_BASE=/app/)
#                    landing page (site/) at "/"
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enables cross-building the arm64 image on the amd64 runner via emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Publish to the GitHub Container Registry (ghcr.io/<owner>/librespice).
      # Skipped for pull requests, which only verify the build.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Root variant (served at "/") ────────────────────────────────────────
      - name: Derive image tags (root)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (root)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=root
          cache-to: type=gha,mode=max,scope=root

      # ── Subpath variant (served under "/app/") ──────────────────────────────
      - name: Derive image tags (app subpath)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Same tags as the root variant, suffixed with "-app"
          # (e.g. :latest-app, :main-app).
          flavor: suffix=-app
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (app subpath)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_PATH=/app/
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
